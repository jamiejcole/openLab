# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openlab-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openlab-audio = { path = "../crates/audio", default-features = false }
openlab-core = { path = "../crates/core" }
openlab-engine = { path = "../crates/engine" }
# The osc_session target implements the engine's `OscShow`, whose types come from these (same
# versions as the engine crate).
rosc = { version = "0.11.4", default-features = false }
serde_json = "1.0.154"
uuid = { version = "1.29.0", default-features = false }

# Kept out of the engine workspace: it needs nightly and sanitizer flags.
[workspace]

[[bin]]
name = "show_file"
path = "fuzz_targets/show_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "osc"
path = "fuzz_targets/osc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "osc_session"
path = "fuzz_targets/osc_session.rs"
test = false
doc = false
bench = false
