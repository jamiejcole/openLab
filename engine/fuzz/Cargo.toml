# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openlab-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openlab-audio = { path = "../crates/audio", default-features = false }
openlab-core = { path = "../crates/core" }
openlab-engine = { path = "../crates/engine" }

# Kept out of the engine workspace: it needs nightly and sanitizer flags.
[workspace]

[[bin]]
name = "show_file"
path = "fuzz_targets/show_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "osc"
path = "fuzz_targets/osc.rs"
test = false
doc = false
bench = false
