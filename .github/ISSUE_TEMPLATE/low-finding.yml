name: Low review finding
description: A Low finding from a review (a Medium is filed with the severity:medium label, never as low)
labels: [low]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: file:line
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Input or state, and the wrong outcome.
    validations:
      required: true
  - type: textarea
    id: reachable
    attributes:
      label: Reachable in production?
      description: How, or "no" with the reason.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix direction
