# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  # PR branches are tested once, through pull_request; pushes are tested only on main.
  push:
    branches: [main]
  pull_request:
  # The release perf, CPU-budget and soak gates run here and on main, not on every PR.
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A new push to a PR replaces its run; runs on main always finish, so every merge gets its gates.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which jobs a change needs. Skipped jobs count as passed for the required
  # "CI Result" check; anything but a pull request or a push with a known base runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      mac: ${{ steps.diff.outputs.mac }}
      bundle: ${{ steps.diff.outputs.bundle }}
      intel: ${{ steps.diff.outputs.intel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git merge-base "$PR_BASE" HEAD) ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            echo "intel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$files"
          # The path sets live in scripts/paths.sh, shared with scripts/prepush.sh.
          . scripts/paths.sh
          match() { printf '%s\n' "$files" | grep -qE "$1"; }
          if match "$PATHS_ALL_RE"; then all=true; else all=false; fi
          if [ "$all" = true ] || match "$PATHS_ENGINE_RE"; then echo "engine=true"; else echo "engine=false"; fi >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ]; then mac_re="$PATHS_MAC_PR_RE"; else mac_re="$PATHS_MAC_MAIN_RE"; fi
          if [ "$all" = true ] || match "$mac_re"; then echo "mac=true"; else echo "mac=false"; fi >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != pull_request ] || [ "$all" = true ] || match "$PATHS_BUNDLE_RE"; then echo "bundle=true"; else echo "bundle=false"; fi >> "$GITHUB_OUTPUT"
          if [ "$all" = true ] || match "$PATHS_INTEL_RE"; then echo "intel=true"; else echo "intel=false"; fi >> "$GITHUB_OUTPUT"

  # Repo hygiene that needs no toolchain (scripts/check-repo.sh): fast, runs on every PR and push.
  checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-repo.sh

  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      # macOS Intel runs on main, nightly, on demand, and on PRs that touch perf-sensitive code
      # (`changes.intel`): Windows covers other x86-64 code on PRs, the app job builds and checks the
      # universal bundle, and the Intel queue was the longest wait.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.intel != 'true' && '[{"name":"macOS arm64","os":"macos-26"},{"name":"Windows x64","os":"windows-2025"}]' || '[{"name":"macOS arm64","os":"macos-26"},{"name":"macOS Intel","os":"macos-26-intel"},{"name":"Windows x64","os":"windows-2025"}]') }}
    runs-on: ${{ matrix.os }}
    # Backstop: a hung test fails the job instead of holding the runner for hours (arm64 also
    # builds and runs the release suite).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in engine/rust-toolchain.toml.
      - run: rustup toolchain install
      # A hosted runner's cache extract can hang (gtar | unzstd seen stuck 40+ min on macos-26-intel);
      # give up on the cache and build cold instead of holding the job until its timeout.
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        continue-on-error: true
        with:
          workspaces: engine
          # Only main saves; PRs restore main's cache instead of filling the repo's 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      # Release builds skip debug-only checks (the cue engine's full model check on every call,
      # debug_assert!s) and optimise differently, so the suite also runs as shipped. In this job
      # rather than a separate one: it reuses the job's checkout, toolchain and cache, and runs on
      # every PR; arm64 is the fastest runner.
      - name: Tests (release)
        if: matrix.os == 'macos-26'
        run: cargo test --release --workspace --locked --no-fail-fast
      # NFR-23/QA-06: the mixer must render 64 stereo voices with fades at >= 10x real time.
      # Release-only (a debug build is far slower), gated on the slowest runner.
      - name: CPU budget gate
        if: matrix.os == 'macos-26-intel' && github.event_name != 'pull_request'
        run: cargo test --release --locked -p openlab-audio --test cpu_budget -- --ignored --nocapture
      # NFR-24/NFR-25 proxies (M4.12): a 2,000-cue show opens, edits and idles within budget.
      - name: Performance budget gate
        if: matrix.os == 'macos-26-intel' && github.event_name != 'pull_request'
        run: cargo test --release --locked -p openlab-engine --test perf -- --ignored --nocapture
      # NFR-09/QA-05: 24 h of a generated show, run by a random operator, in virtual time on the
      # offline driver (about a minute in release); a ten-minute run is in the normal suite.
      - name: Soak test (24 h virtual)
        if: matrix.os == 'macos-26-intel' && github.event_name != 'pull_request'
        run: cargo test --release --locked -p openlab-engine --test soak -- --ignored --nocapture
      # NFR-09/QA-05: the same show and operator for three minutes of wall clock against the real
      # control loop, with real timer wake-ups and a device stand-in rendering in real time
      # (jitter, xruns, late starts, counts); about four minutes with its final checkpoint.
      # Nightly and on demand only: its bounds depend on a shared runner's timer, and a noisy
      # night must not turn a push to main red. The test first measures the host and skips, with
      # the measurement in the log, when one-block (8 ms) sleeps overshoot by more than a block:
      # both hosted macOS VMs do with their CPUs idle (Intel 26-36 ms at p50, arm64 13-18 ms;
      # issue #213), so here it normally skips. On a machine that must keep real time, set
      # OPENLAB_SOAK_RT_REQUIRE=1 to make a refusal fail instead.
      - name: Soak test (3 min real time)
        if: matrix.os == 'macos-26-intel' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          OPENLAB_SOAK_RT_SECS: "180"
        run: cargo test --release --locked -p openlab-engine --test soak_rt -- --ignored --nocapture

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: toolchain
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' engine/rust-toolchain.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          rust-version: ${{ steps.toolchain.outputs.version }}

  fuzz:
    name: Fuzz smoke
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    env:
      # Pinned so a nightly regression cannot fail unrelated pushes; bump deliberately.
      FUZZ_TOOLCHAIN: nightly-2026-10-15
    steps:
      - uses: actions/checkout@v7
      # The osc, osc_session and protocol targets link openlab-engine, which pulls in cpal; ALSA headers are needed to build it on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      # A hosted runner's cache extract can hang (gtar | unzstd seen stuck 40+ min on macos-26-intel);
      # give up on the cache and build cold instead of holding the job until its timeout.
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        continue-on-error: true
        with:
          workspaces: engine/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-fuzz --locked
      # The fuzz crate is outside the workspace, so the Rust job's fmt and clippy never see it. It lints
      # on the pinned stable toolchain (as `make lint` does); only the fuzz run itself needs nightly.
      - run: rustup toolchain install
        working-directory: engine
      - run: cargo fmt --check && cargo clippy --locked -- -D warnings
        working-directory: engine/fuzz
      - run: make fuzz FUZZ_TIME=60 FUZZ_TOOLCHAIN="$FUZZ_TOOLCHAIN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: engine/fuzz/artifacts/

  # QA-09: AddressSanitizer, ThreadSanitizer and Miri (the undefined-behaviour check; Rust has no UBSan) on a
  # pinned nightly. Slow, so nightly and on demand only, never on a PR or push.
  sanitizers:
    name: Sanitizers (${{ matrix.check }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # TSan took ~20 min on an M-series Mac; a hung test must not hold a runner for the 6 h default.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [sanitize-address, sanitize-thread, miri]
    env:
      # Pinned so a nightly regression cannot turn the gate red unprompted; bump deliberately.
      SAN_TOOLCHAIN: nightly-2026-10-15
      SAN_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      # openlab-audio's default `device` feature pulls in cpal, which needs ALSA headers on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: rustup toolchain install "$SAN_TOOLCHAIN" --profile minimal -c rust-src -c miri
      # A hosted runner's cache extract can hang (gtar | unzstd seen stuck 40+ min on macos-26-intel);
      # give up on the cache and build cold instead of holding the job until its timeout.
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        continue-on-error: true
        with:
          workspaces: engine
          key: ${{ matrix.check }}
      - run: make ${{ matrix.check }} SAN_TOOLCHAIN="$SAN_TOOLCHAIN" SAN_TARGET="$SAN_TARGET"

  mac:
    name: macOS app
    needs: changes
    # The app bundles the engine, so an engine change rebuilds it too.
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      # ARCHITECTURE §11: an Xcode whose SDK cannot target macOS 12.0 must not be adopted.
      - name: Check SDK still supports macOS 12.0
        run: |
          min=$(/usr/libexec/PlistBuddy -c "Print :SupportedTargets:macosx:MinimumDeploymentTarget" \
            "$(xcrun --sdk macosx --show-sdk-path)/SDKSettings.plist")
          echo "SDK minimum deployment target: $min"
          if [ "$(printf '%s\n' "$min" 12.0 | sort -V | tail -1)" != "12.0" ]; then
            echo "::error::Selected SDK minimum deployment target $min is above macOS 12.0"
            exit 1
          fi
      - run: brew install xcodegen
      - run: rustup toolchain install
        working-directory: engine
      # A hosted runner's cache extract can hang (gtar | unzstd seen stuck 40+ min on macos-26-intel);
      # give up on the cache and build cold instead of holding the job until its timeout.
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        continue-on-error: true
        with:
          workspaces: engine
          # Only main saves; PRs restore main's cache instead of filling the repo's 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: swift format lint --strict -r mac/
      - run: make test-mac
      - run: make mac
        if: needs.changes.outputs.bundle == 'true'
      - run: make verify-bundle
        if: needs.changes.outputs.bundle == 'true'

  # The one check branch protection requires: green when every job that ran passed.
  result:
    name: CI Result
    if: always()
    needs: [changes, checks, rust, cargo-deny, fuzz, sanitizers, mac]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # A failed run on main (or the nightly schedule) opens (or comments on) one `ci-red` issue, so a red main
  # is never silent: some jobs (macOS Intel) run only on main, the sanitizers only nightly.
  alert:
    name: Alert on red main
    needs: [result]
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          open=$(gh issue list --label ci-red --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red at $SHA: $RUN"
          else
            gh issue create --label ci-red --title "main CI is red" --body "CI failed on main at $SHA: $RUN"
          fi
