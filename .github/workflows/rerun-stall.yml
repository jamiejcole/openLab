name: Re-run runner stall

# A CI run whose only failures are proven runner stalls (an app test job ended with exit 75: a sample
# showed the hosted VM's WindowServer stuck in its GPU driver, #669) has its failed jobs re-run once,
# so nobody waits to do it by hand. Only the first attempt: a stall that comes back on the re-run
# stays red and is investigated. The decision is scripts/ci-rerun-stall.sh, run from the default
# branch; no code from the run is checked out or run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Re-run the jobs; read the jobs' annotations; check out the script.
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-rerun-stall.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: scripts/ci-rerun-stall.sh "$RUN"
