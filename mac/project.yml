# SPDX-License-Identifier: GPL-3.0-or-later
# XcodeGen spec. Generate with `xcodegen` in this directory; the .xcodeproj is not committed.
name: openLab
options:
  bundleIdPrefix: dev.openlab
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  openLab:
    type: application
    platform: macOS
    sources:
      - openLab
      # The fake engine's welcome snapshot (launch argument `-OpenLabEngine fake`), so the running
      # app never reads the repo path. Debug only (excluded from Release below).
      - path: ../engine/fixtures/protocol/server/welcome.json
        buildPhase: resources
    settings:
      configs:
        # A shipping app holds no fake engine, demo shows or fault switches (only Debug can run them).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: FakeEngine.swift FakeShows.swift FakeEngineProcesses.swift welcome.json
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlab.openLab
        PRODUCT_NAME: openLab
        ENABLE_APP_SANDBOX: NO
        # The engine build script reads ../engine and writes engine/target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "Licensed under the GNU GPL v3 or later."
    preBuildScripts:
      - name: Check Localizable.strings
        script: '"$SRCROOT/scripts/check-strings.sh"'
        inputFiles:
          - $(SRCROOT)/openLab/en.lproj/Localizable.strings
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Build openlab-engine
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - openLabTests
        - openLabUITests
  openLabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - openLabTests
      # Golden protocol files, copied into the test bundle (tests must not read the repo path).
      - path: ../engine/fixtures/protocol
        type: folder
        buildPhase: resources
      # Shared with the Rust test of core's `display_name` (M2.29c).
      - path: ../engine/fixtures/display_name.json
        buildPhase: resources
    dependencies:
      - target: openLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlab.openLabTests
        # XCTest itself requires macOS 14; the app stays at 12.0.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  openLabUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - openLabUITests
    dependencies:
      - target: openLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlab.openLabUITests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_TARGET_NAME: openLab
